[workspace]
members = [
    "runtime",
    "examples/main_block_plugin",
    "examples/per_file_main_block",
    "examples/per_file_decorated",
]
# Bare `cargo build` / maturin builds only the extension; the example plugin
# is built explicitly by `dead-cst build-plugin`.
default-members = ["."]
# The vendored ruff tree is its own workspace; don't let ours absorb it.
exclude = ["vendor"]

[package]
name = "dead-cst-native"
version = "0.14.0"
edition = "2021"
publish = false

[lib]
name = "dead_cst_native"
crate-type = ["cdylib"]

# ``extension-module`` is what tells pyo3 to skip linking against
# libpython (Python loads the cdylib and provides the symbols at
# runtime). Production builds (uv build -> maturin) keep it on via the
# default feature; ``cargo test --no-default-features`` turns it off
# so the rust test binary can resolve PyDict_Next / PySequence_Check
# / etc. at link time.
[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module", "dead-cst-runtime/extension-module"]

[dependencies]
pyo3 = { version = "0.22", features = ["abi3-py311", "multiple-pymethods"] }
# The whole implementation lives in the runtime crate. By default this is
# linked as an rlib (static, self-contained wheel). A `-C prefer-dynamic`
# build links it as the shared `libdead_cst_runtime.dylib` instead, which
# external native plugins also link — giving one shared salsa/ty runtime.
# `default-features = false` so the root's `extension-module` feature is the
# single switch: `cargo test --no-default-features` then disables it on the
# runtime too (pyo3 links libpython for the test binary).
dead-cst-runtime = { path = "runtime", default-features = false }
