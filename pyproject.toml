[project]
name = "dead-cst"
dynamic = ["version"]
description = "Python dead code analysis backed by a Rust extension (ty + ruff)"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Luke Petre", email = "lpetre@gmail.com" }
]
requires-python = ">=3.11"
keywords = ["dead-code", "static-analysis", "linting"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "libcst>=1.8.6",
    "typer>=0.12",
]

[project.optional-dependencies]
# Authoring native plugins (`dead-cst build-plugin`) needs the prebuilt runtime
# + its dependency closure to compile against. Those are large (~130 MB
# compressed) and platform-specific, so they ship as a SEPARATE package pulled
# in only on demand — the default `dead-cst` wheel stays small + self-contained.
# (The publish workflow pins this to `== <this version>`; the load-time ABI
# fingerprint rejects any mismatch regardless.)
build-plugin = ["dead-cst-plugin-host"]

[project.urls]
Homepage = "https://github.com/lpetre/dead-cst"
Repository = "https://github.com/lpetre/dead-cst"
Issues = "https://github.com/lpetre/dead-cst/issues"
Changelog = "https://github.com/lpetre/dead-cst/blob/main/CHANGELOG.md"

[project.scripts]
dead-cst = "dead_cst.cli:main_cli"

[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[tool.uv.sources]
# The `build-plugin` extra's payload lives in this repo (a data-only package
# populated by `dead-cst bundle-plugin-host`); resolve it from the local path
# rather than an index. Editable so `dead_cst_plugin_host` imports from the
# source dir the bundle is written into. Only installed via the extra.
dead-cst-plugin-host = { path = "plugin-host", editable = true }

[tool.maturin]
# Mixed Rust/Python layout per the maturin user guide and pydantic-core's
# template: ``Cargo.toml`` + ``src/`` at the repo root, Python sources under
# ``python/dead_cst/``. The Rust ``cdylib`` is compiled and embedded inside
# the ``dead_cst`` package as ``dead_cst/_native.*.so`` — one wheel ships
# both halves.
module-name = "dead_cst._native"
python-source = "python"
# Enables the ``extension-module`` feature defined in ``Cargo.toml``,
# which forwards to ``pyo3/extension-module`` (skip libpython linkage --
# Python loads the cdylib at runtime). Tests turn this off via
# ``cargo test --no-default-features``.
features = ["extension-module"]
# Type stub + ``py.typed`` marker that ship alongside the compiled extension.
# Other ``.py`` sources under ``python/dead_cst/`` are picked up automatically.
include = ["python/dead_cst/_native.pyi", "python/dead_cst/py.typed"]

[dependency-groups]
dev = [
    "prek>=0.3.11",
    "pytest>=8.4.1",
    "pytest-cov>=5.0.0",
    "pytest-watcher>=0.4.3",
    "ruff>=0.11.2",
    "ty>=0.0.1a7",
    # Frameworks the 3rd-party plugins target. The plugins now require
    # their package to be resolved to an installed distribution (rather
    # than the ``[unresolved] <pkg>`` fallback), so tests need them
    # importable. ``click`` and ``typer`` are already pulled in by the
    # runtime deps; only ``fastapi``, ``flask``, ``celery``, and ``fastmcp``
    # are added here.
    "celery>=5.3",
    "fastapi>=0.110",
    "fastmcp>=2.0",
    "flask>=3.0",
    "discord-py>=2.7.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# E2E tests clone real repos from GitHub and are deselected by default
# so the standard ``uv run pytest`` invocation stays hermetic. Run them
# explicitly with ``uv run pytest -m e2e``.
addopts = "-m 'not e2e'"
markers = [
    "e2e: end-to-end test that clones a real GitHub repo (opt-in via -m e2e)",
]

[tool.coverage.run]
branch = true
source = ["python/dead_cst"]
# ProcessPoolExecutor workers (used by ``build_symbol_graph(workers=...)``)
# must run with the multiprocessing tracer or coverage's import-time
# instrumentation drifts the class identity of ``_CallItem`` and causes
# pickle round-trips to fail under ``pytest --cov``.
concurrency = ["thread", "multiprocessing"]
parallel = true
sigterm = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@overload",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint.isort]
known-first-party = ["dead_cst"]

[tool.ty.src]
# Type-check only the package itself. Tests, examples, and the workspace
# fixtures intentionally exercise untyped third-party internals and the
# unresolved-import case the analyzer is meant to detect, so they aren't
# meaningful targets for ty.
include = ["python/dead_cst"]
# The rust extension is shipped as ``python/dead_cst/_native.pyi`` (peer to
# the compiled ``.so``); ty picks it up via the package layout without any
# extra-paths shim.
