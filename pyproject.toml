[project]
name = "dead-cst"
dynamic = ["version"]
description = "Python dead code analysis using libcst"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Luke Petre", email = "lpetre@gmail.com" }
]
requires-python = ">=3.11"
keywords = ["dead-code", "libcst", "static-analysis", "linting"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "libcst>=1.8.6",
    "rustworkx>=0.15",
    "tqdm>=4.66",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/lpetre/dead-cst"
Repository = "https://github.com/lpetre/dead-cst"
Issues = "https://github.com/lpetre/dead-cst/issues"
Changelog = "https://github.com/lpetre/dead-cst/blob/main/CHANGELOG.md"

[project.scripts]
dead-cst = "dead_cst.cli:main_cli"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
# PyPI and TestPyPI reject PEP 440 local version identifiers (+gSHA),
# which hatch-vcs adds to between-tag builds by default. hatch-vcs passes
# raw-options as kwargs to setuptools_scm.get_version, so this is the only
# place the scheme can be configured — SETUPTOOLS_SCM_OVERRIDES_FOR_* is
# ignored because that env var is only read by Configuration.from_file().
raw-options = { local_scheme = "no-local-version" }

[tool.hatch.build.hooks.vcs]
version-file = "dead_cst/_version.py"

[dependency-groups]
dev = [
    "prek>=0.3.11",
    "pytest>=8.4.1",
    "pytest-cov>=5.0.0",
    "pytest-watcher>=0.4.3",
    "ruff>=0.11.2",
    "ty>=0.0.1a7",
    # Frameworks the 3rd-party plugins target. The plugins now require
    # their package to be resolved to an installed distribution (rather
    # than the ``[unresolved] <pkg>`` fallback), so tests need them
    # importable. ``click`` and ``typer`` are already pulled in by the
    # runtime deps; only ``fastapi``, ``flask``, ``celery``, and ``fastmcp``
    # are added here.
    "celery>=5.3",
    "fastapi>=0.110",
    "fastmcp>=2.0",
    "flask>=3.0",
    # ``networkx`` is no longer a runtime dep but a handful of resolver /
    # external-dist tests fixture-import it as a recognizable third-party
    # name (it has to be importable for the analyzer to classify it as
    # ``[external dist] networkx`` rather than ``[unresolved]``).
    "networkx>=3.0",
]

[tool.pytest.ini_options]
# Scope collection to the project's own suite. Without this, pytest also
# walks ``examples/uv-workspace/packages/*/tests/``, where two ``tests/``
# packages share the same ``tests.conftest`` module name and fail
# collection with ``ImportPathMismatchError`` (the very layout the
# uv-workspace example exists to demonstrate).
testpaths = ["tests"]
# E2E tests clone real repos from GitHub and are deselected by default
# so the standard ``uv run pytest`` invocation stays hermetic. Run them
# explicitly with ``uv run pytest -m e2e``.
addopts = "-m 'not e2e'"
markers = [
    "e2e: end-to-end test that clones a real GitHub repo (opt-in via -m e2e)",
]

[tool.coverage.run]
branch = true
source = ["dead_cst"]
omit = ["dead_cst/_version.py"]
# ProcessPoolExecutor workers (used by ``build_symbol_graph(workers=...)``)
# must run with the multiprocessing tracer or coverage's import-time
# instrumentation drifts the class identity of ``_CallItem`` and causes
# pickle round-trips to fail under ``pytest --cov``.
concurrency = ["thread", "multiprocessing"]
parallel = true
sigterm = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@overload",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint.isort]
known-first-party = ["dead_cst"]

[tool.ty.src]
# Type-check only the package itself. Tests, examples, and the workspace
# fixtures intentionally exercise untyped LibCST internals and the
# unresolved-import case the analyzer is meant to detect, so they aren't
# meaningful targets for ty.
include = ["dead_cst"]
