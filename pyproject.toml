[project]
name = "dead-cst"
version = "0.1.0"
description = "Python dead code analysis using libcst"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Luke Petre", email = "lpetre@gmail.com" }
]
requires-python = ">=3.11"
keywords = ["dead-code", "libcst", "static-analysis", "linting"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "libcst>=1.8.2",
    "networkx>=3.5",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/lpetre/dead-cst"
Repository = "https://github.com/lpetre/dead-cst"
Issues = "https://github.com/lpetre/dead-cst/issues"

[project.scripts]
dead-cst = "dead_cst.cli:main_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "ty>=0.0.1a7",
    "pytest>=8.4.1",
    "pytest-watcher>=0.4.3",
]

[tool.ruff]
line-length = 100

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint.isort]
known-first-party = ["dead_cst"]
