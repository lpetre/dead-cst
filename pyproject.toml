[project]
name = "dead-cst"
version = "0.1.0"
description = "Python dead code analysis using libcst"
readme = "README.md"
authors = [
    { name = "Luke Petre", email = "lpetre@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "libcst>=1.8.2",
    "networkx>=3.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "pyright>=1.1.403",
    "pytest>=8.4.1",
]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100

[tool.usort.known]
first_party = ["dead_cst"]
