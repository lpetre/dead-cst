version = 1
revision = 3
requires-python = ">=3.11"

[manifest]
members = [
    "app",
    "core",
    "uv-workspace-demo",
]

[[package]]
name = "app"
version = "0.0.0"
source = { editable = "packages/app" }
dependencies = [
    { name = "core" },
]

[package.metadata]
requires-dist = [{ name = "core", editable = "packages/core" }]

[[package]]
name = "core"
version = "0.0.0"
source = { editable = "packages/core" }

[[package]]
name = "uv-workspace-demo"
version = "0.0.0"
source = { virtual = "." }
