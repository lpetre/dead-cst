name: Publish

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  # One platform-specific wheel per target. Maturin handles the
  # cdylib build (abi3-py311, so a single wheel covers every Python
  # >=3.11) and produces a manylinux/macos/windows wheel with the
  # ``.so`` / ``.pyd`` embedded inside ``python/dead_cst/``.
  # The package version is read straight from ``Cargo.toml``; bump
  # manually per release (pydantic-core style).
  wheels:
    name: Build wheel (${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: ubuntu-latest,  target: x86_64-unknown-linux-gnu,  manylinux: "2_28" }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, manylinux: "2_28" }
          - { runner: macos-14,       target: aarch64-apple-darwin,       manylinux: "auto" }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc,     manylinux: "auto" }
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
      # Stamp dead-cst + dead-cst-plugin-host to the *same* version and pin the
      # `[build-plugin]` extra to it. On push to main this mints a dev version;
      # on release it reuses the committed Cargo.toml version. See
      # scripts/stamp_version.py for why the lockstep is mandatory.
      - name: Stamp versions (dead-cst + plugin-host in lockstep)
        shell: bash
        run: |
          python -m pip install --quiet setuptools-scm
          python scripts/stamp_version.py
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: --release --out dist --interpreter 3.11
          sccache: true
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.platform.target }}
          path: dist/

  # The `dead-cst[build-plugin]` extra's payload: a *separate*,
  # platform-specific `dead-cst-plugin-host` wheel carrying the prebuilt
  # runtime dylib + its rlib/proc-macro dependency closure + libstd. Built by
  # `dead-cst bundle-plugin-host` from source on each target, then packaged as a
  # `py3-none-<plat>` wheel (see plugin-host/setup.py). The runtime version is
  # baked into the ABI fingerprint, so this MUST be built from the same stamped
  # Cargo.toml version as the host wheel above (and with the pinned toolchain).
  # build-plugin only supports macOS + Linux, so no Windows target here.
  plugin-host:
    name: Build plugin-host wheel (${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.runner }}
    container: ${{ matrix.platform.container }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            plat: manylinux_2_28_x86_64
            container: quay.io/pypa/manylinux_2_28_x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            plat: manylinux_2_28_aarch64
            container: quay.io/pypa/manylinux_2_28_aarch64
          - runner: macos-14
            target: aarch64-apple-darwin
            plat: macosx_11_0_arm64
            container: ""
    env:
      # Match the host wheel's macOS floor so pip selects this wheel alongside it.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
      # The manylinux container checks out as root; mark the tree safe so git
      # (and setuptools-scm) work. Harmless on the macOS host runner.
      - name: Configure git safe.directory
        shell: bash
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install Rust (pinned via rust-toolchain.toml)
        shell: bash
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain none --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - name: Install uv
        shell: bash
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install Python 3.11
        shell: bash
        run: uv python install 3.11
      - name: Stamp versions (dead-cst + plugin-host in lockstep)
        shell: bash
        run: uv run --no-project --with setuptools-scm python scripts/stamp_version.py
      # `uv sync` compiles + installs dead-cst (the `bundle-plugin-host` command);
      # the command then rebuilds the runtime prefer-dynamic and assembles the
      # relocatable bundle into plugin-host/dead_cst_plugin_host/.
      - name: Build runtime bundle
        shell: bash
        run: |
          uv sync
          uv run dead-cst bundle-plugin-host --release
      - name: Build platform wheel
        shell: bash
        run: |
          cd plugin-host
          uv run --no-project --with "setuptools>=70.1" --with wheel \
            python setup.py bdist_wheel \
            --plat-name "${{ matrix.platform.plat }}" \
            --dist-dir "$GITHUB_WORKSPACE/dist"
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-host-${{ matrix.platform.target }}
          path: dist/

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Stamp versions (dead-cst + plugin-host in lockstep)
        shell: bash
        run: |
          python -m pip install --quiet setuptools-scm
          python scripts/stamp_version.py
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/

  publish-testpypi:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [wheels, plugin-host, sdist]
    runs-on: ubuntu-latest
    environment: testpypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "wheel-*"
          merge-multiple: true
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          pattern: "plugin-host-*"
          merge-multiple: true
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    if: github.event_name == 'release'
    needs: [wheels, plugin-host, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "wheel-*"
          merge-multiple: true
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          pattern: "plugin-host-*"
          merge-multiple: true
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  attach-release-assets:
    if: github.event_name == 'release'
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "wheel-*"
          merge-multiple: true
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          pattern: "plugin-host-*"
          merge-multiple: true
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
