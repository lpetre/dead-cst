name: Publish

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  # One platform-specific wheel per target. Maturin handles the
  # cdylib build (abi3-py311, so a single wheel covers every Python
  # >=3.11) and produces a manylinux/macos/windows wheel with the
  # ``.so`` / ``.pyd`` embedded inside ``python/dead_cst/``.
  # The package version is read straight from ``Cargo.toml``; bump
  # manually per release (pydantic-core style).
  wheels:
    name: Build wheel (${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: ubuntu-latest,  target: x86_64-unknown-linux-gnu,  manylinux: "2_28" }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, manylinux: "2_28" }
          - { runner: macos-14,       target: aarch64-apple-darwin,       manylinux: "auto" }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc,     manylinux: "auto" }
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Stamp dev version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          python -m pip install --quiet setuptools-scm
          version=$(python -c "from setuptools_scm import get_version; print(get_version(local_scheme='no-local-version'))" | sed 's/\.dev/-dev/')
          sed -i.bak "s/^version = .*/version = \"$version\"/" Cargo.toml
          rm Cargo.toml.bak
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: --release --out dist --interpreter 3.11
          sccache: true
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.platform.target }}
          path: dist/

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Stamp dev version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python -m pip install --quiet setuptools-scm
          version=$(python -c "from setuptools_scm import get_version; print(get_version(local_scheme='no-local-version'))" | sed 's/\.dev/-dev/')
          sed -i.bak "s/^version = .*/version = \"$version\"/" Cargo.toml
          rm Cargo.toml.bak
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/

  # The `dead-cst[build-plugin]` payload: the prebuilt runtime + dependency
  # closure, packaged as the separate `dead-cst-plugin-host` distribution.
  # `dead-cst bundle-plugin-host` relocates the dylib closure with
  # install_name_tool + ad-hoc codesign, so it is macOS/arm64-only today —
  # hence a single `aarch64-apple-darwin` wheel. The artifact name matches the
  # `wheel-*` pattern the publish jobs already download.
  plugin-host:
    name: Build plugin-host wheel (aarch64-apple-darwin)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Stamp dev version (Cargo + plugin-host, kept in lockstep)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          python3 -m pip install --quiet setuptools-scm
          # The plugin-host version must match `dead-cst` exactly (the load-time
          # ABI fingerprint check depends on it). Cargo wants a SemVer
          # pre-release (`-dev`); the plugin-host's setuptools build wants PEP 440
          # (`.dev`) — maturin normalizes the wheel the same way.
          pep440=$(python3 -c "from setuptools_scm import get_version; print(get_version(local_scheme='no-local-version'))")
          cargo_ver=$(echo "$pep440" | sed 's/\.dev/-dev/')
          sed -i.bak "s/^version = .*/version = \"$cargo_ver\"/" Cargo.toml
          sed -i.bak "s/^version = .*/version = \"$pep440\"/" plugin-host/pyproject.toml
          rm Cargo.toml.bak plugin-host/pyproject.toml.bak
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: 3.12
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - name: Build the relocatable plugin-host bundle
        # Builds the runtime + closure and populates plugin-host/dead_cst_plugin_host/.
        run: |
          uv sync
          uv run dead-cst bundle-plugin-host --release
      - name: Build the plugin-host wheel
        run: uv build --wheel --out-dir dist plugin-host
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-plugin-host
          path: dist/

  publish-testpypi:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [wheels, sdist, plugin-host]
    runs-on: ubuntu-latest
    environment: testpypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "wheel-*"
          merge-multiple: true
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    if: github.event_name == 'release'
    needs: [wheels, sdist, plugin-host]
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "wheel-*"
          merge-multiple: true
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  attach-release-assets:
    if: github.event_name == 'release'
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "wheel-*"
          merge-multiple: true
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
