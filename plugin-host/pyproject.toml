[build-system]
requires = ["setuptools>=70.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dead-cst-plugin-host"
# Must match the `dead-cst` version exactly — the runtime ABI fingerprint
# (rustc commit + version) is checked when a plugin loads. The publish
# workflow keeps these in lockstep.
version = "0.13.0"
description = "Prebuilt dead-cst runtime + dependency closure for building native plugins."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"

[tool.setuptools]
packages = ["dead_cst_plugin_host"]

# The bundle payload is binary + platform-specific (a runtime dylib, the rlib
# dependency closure, proc-macro dylibs, libstd). `dead-cst bundle-plugin-host`
# populates these; the publish workflow builds one platform wheel per target.
[tool.setuptools.package-data]
dead_cst_plugin_host = ["*.dylib", "*.rlib", "*.so", "*.dll", "*.pyd"]
